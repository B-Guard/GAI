services:
  neo4j:
    image: neo4j:5.26.19
    container_name: neo4j-gai
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/neo4jpass123"

      # APOC allow
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"

      # optional noise reduction
      NEO4J_dbms_usage__reporting_enabled: "false"
    volumes:
      - ./neo4jdata:/data
      - ./neo4jlogs:/logs
      - ./neo4jimport:/import
      - ./neo4jplugins:/plugins
    restart: unless-stopped

  neo4j-init-load:
    image: neo4j:5.26.19
    container_name: neo4j-gai-init-load
    depends_on:
      - neo4j
    volumes:
      - ./neo4jdata:/data
      - ./neo4jlogs:/logs
      - ./neo4jimport:/import
    restart: "no"
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      set -euo pipefail;
      SENTINEL="/data/.dump_loaded";
      DUMP="/import/neo4j.dump";
      DB="neo4j";

      if [ -f "$SENTINEL" ]; then
        echo "[init] dump already loaded, skipping";
        exit 0;
      fi

      if [ ! -f "$DUMP" ]; then
        echo "[init] ERROR: dump not found at $DUMP";
        ls -la /import || true;
        exit 1;
      fi

      echo "[init] waiting for neo4j to start...";
      # wait until neo4j is actually up enough to accept admin stop
      for i in $(seq 1 60); do
        if docker exec neo4j-gai neo4j-admin server status >/dev/null 2>&1; then
          break
        fi
        sleep 1
      done

      echo "[init] stopping neo4j...";
      docker exec neo4j-gai neo4j-admin server stop || true;

      echo "[init] loading dump into /data (db=$DB) ...";
      neo4j-admin database load "$DB" --from-path=/import --overwrite-destination=true;

      echo "[init] marking sentinel...";
      touch "$SENTINEL";

      echo "[init] starting neo4j...";
      docker start neo4j-gai;

      echo "[init] done";
